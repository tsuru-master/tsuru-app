<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鶴pay</title>
  <link rel="apple-touch-icon" href="https://tsuru-master.github.io/tsuru-app/icon.png">
  <link rel="icon" href="https://tsuru-master.github.io/tsuru-app/icon.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #70d6ff 0%, #ff70a6 100%);
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }
    .container {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
      border: 3px solid #333333;
      position: relative;
    }
    h1 {
      font-size: 24px;
      color: #222222;
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 3px solid #ff477e;
      letter-spacing: 1px;
    }

    .auth-card {
      display: block;
    }
    .app-card {
      display: none;
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f5f9;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      font-weight: bold;
    }
    .btn-logout {
      background-color: #64748b;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }

    .user-card {
      background: #fef08a;
      color: #854d0e;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
      border: 2px solid #eab308;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }
    .user-title {
      font-size: 13px;
      font-weight: bold;
    }
    .user-count {
      font-size: 36px;
      font-weight: bold;
      margin-top: 4px;
      color: #713f12;
    }

    .admin-nav {
      text-align: right;
      margin-bottom: 16px;
    }
    .btn-admin-view {
      background-color: #333333;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      color: #333333;
      font-weight: bold;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #555555;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      background-color: #ffffff;
      color: #111111;
      font-weight: 500;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #0077b6;
      box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.3);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #ff2a70;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(255, 42, 112, 0.4);
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-submit:active {
      background-color: #d90429;
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: #0284c7;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }

    .toggle-auth {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #0284c7;
      cursor: pointer;
      text-decoration: underline;
      font-weight: bold;
    }

    .history {
      margin-top: 24px;
      border-top: 3px solid #333333;
      padding-top: 16px;
    }
    .history h2 {
      font-size: 16px;
      color: #222222;
      margin-bottom: 12px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: #e0f2fe;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #111111;
      border: 2px solid #0284c7;
      border-left: 6px solid #ff2a70;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      background: #4b5563;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* モーダル表示エリア */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
      border: 3px solid #333333;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-content h3 {
      margin-top: 0;
      font-size: 18px;
      color: #222222;
      border-bottom: 2px solid #0284c7;
      padding-bottom: 8px;
    }
    .id-list {
      max-height: 280px;
      overflow-y: auto;
      margin: 12px 0;
      padding: 0;
    }
    .id-list li {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-left: 4px solid #0284c7;
      margin-bottom: 8px;
      padding: 10px 12px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .id-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 4px;
    }
    .status-online {
      background-color: #d1fae5;
      color: #047857;
      border: 1px solid #10b981;
    }
    .status-offline {
      background-color: #f3f4f6;
      color: #6b7280;
      border: 1px solid #d1d5db;
    }
    .id-action-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .btn-admin-action {
      flex: 1;
      padding: 6px 8px;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      color: #ffffff;
    }
    .btn-grant { background-color: #10b981; }
    .btn-delete-id { background-color: #ef4444; }

    .btn-reset-pass {
      width: 100%;
      padding: 10px;
      background-color: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-close {
      width: 100%;
      padding: 10px;
      background-color: #4b5563;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>鶴pay</h1>

    <!-- ログイン・登録画面 -->
    <div id="authCard" class="auth-card">
      <h2 id="authTitle" style="font-size: 18px; text-align: center; margin-bottom: 16px;">ログイン</h2>
      
      <div class="form-group">
        <label>ユーザーID / 名前</label>
        <input type="text" id="loginId" placeholder="例：山田太郎">
      </div>

      <div class="form-group">
        <label>パスワード</label>
        <input type="password" id="loginPass" placeholder="パスワードを入力">
      </div>

      <button id="authBtn" class="btn-submit" onclick="handleAuth()">ログイン</button>
      
      <div id="toggleAuthText" class="toggle-auth" onclick="toggleAuthMode()">
        新規アカウント作成はこちら
      </div>
    </div>

    <!-- アプリメイン画面 -->
    <div id="appCard" class="app-card">
      
      <div class="user-bar">
        <span>👤 ログイン中: <strong id="currentUserId">---</strong></span>
        <button class="btn-logout" onclick="logout()">ログアウト</button>
      </div>

      <div class="admin-nav">
        <button class="btn-admin-view" onclick="openAdminIdList()">🔑 管理者メニュー</button>
      </div>

      <!-- ログインユーザー自身の鶴数表示カード -->
      <div class="user-card">
        <div class="user-title"><span id="targetUserName">---</span> さんの所有鶴数</div>
        <div class="user-count"><span id="userTsuru">0</span> 鶴</div>
      </div>

      <div class="form-group">
        <label>区分</label>
        <select id="type" onchange="toggleTargetInput()">
          <option value="受鶴">受鶴（増える）</option>
          <option value="送鶴">送鶴（減る）</option>
        </select>
      </div>

      <div class="form-group" id="targetIdGroup" style="display: none;">
        <label>送鶴相手のID（登録済みのIDのみ）</label>
        <input type="text" id="targetId" placeholder="例：鈴木花子">
      </div>

      <div class="form-group">
        <label>数量</label>
        <input type="number" id="amount" placeholder="例：10" min="1">
      </div>

      <div class="form-group">
        <label>詳細・備考</label>
        <input type="text" id="detail" placeholder="例：お礼用">
      </div>

      <button class="btn-submit" onclick="addRecord()">送信（記録）</button>

      <div class="history">
        <h2>自分の記録履歴</h2>
        <ul id="historyList"></ul>
      </div>
    </div>

  </div>

  <!-- 管理者用モーダル -->
  <div class="modal-overlay" id="idModal">
    <div class="modal-content">
      <h3>管理者メニュー（ID一覧・オンライン状態管理）</h3>
      <ul class="id-list" id="idListContainer"></ul>
      <button class="btn-reset-pass" onclick="resetAllUserPasswords()">🚨 全ユーザーのパスワード・IDを一括初期化</button>
      <button class="btn-close" onclick="closeAdminIdList()">閉じる</button>
    </div>
  </div>

  <script>
    const ADMIN_PASS = "1234";
    let isRegisterMode = false;
    let loggedInUser = null;

    window.onload = function() {
      const savedUser = sessionStorage.getItem('tsuruLoggedInUser');
      if (savedUser) {
        loggedInUser = savedUser;
        setOnlineStatus(loggedInUser, true);
        showApp();
      }
    };

    function setOnlineStatus(id, isOnline) {
      if (!id) return;
      let activeUsers = JSON.parse(localStorage.getItem('tsuruActiveUsers')) || {};
      if (isOnline) {
        activeUsers[id] = Date.now();
      } else {
        delete activeUsers[id];
      }
      localStorage.setItem('tsuruActiveUsers', JSON.stringify(activeUsers));
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      const title = document.getElementById('authTitle');
      const btn = document.getElementById('authBtn');
      const toggleText = document.getElementById('toggleAuthText');

      if (isRegisterMode) {
        title.textContent = "新規アカウント登録";
        btn.textContent = "登録する";
        btn.classList.add('btn-secondary');
        toggleText.textContent = "すでに登録済みの方（ログインへ）";
      } else {
        title.textContent = "ログイン";
        btn.textContent = "ログイン";
        btn.classList.remove('btn-secondary');
        toggleText.textContent = "新規アカウント作成はこちら";
      }
    }

    function handleAuth() {
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      if (!id || !pass) {
        alert('IDとパスワードの両方を入力してください');
        return;
      }

      let userPasswords = JSON.parse(localStorage.getItem('tsuruUserPasswords')) || {};

      if (isRegisterMode) {
        if (userPasswords[id]) {
          alert('このIDは既に登録されています。ログインするか別のIDをお使いください。');
          return;
        }
        userPasswords[id] = pass;
        localStorage.setItem('tsuruUserPasswords', JSON.stringify(userPasswords));
        alert('アカウント登録が完了しました！ログインします。');
        loggedInUser = id;
        sessionStorage.setItem('tsuruLoggedInUser', id);
        setOnlineStatus(id, true);
        showApp();
      } else {
        if (!userPasswords[id]) {
          alert('登録されていないIDです。まずは新規アカウント作成を行ってください。');
          return;
        }
        if (userPasswords[id] !== pass) {
          alert('パスワードが正しくありません');
          return;
        }
        loggedInUser = id;
        sessionStorage.setItem('tsuruLoggedInUser', id);
        setOnlineStatus(id, true);
        showApp();
      }

      document.getElementById('loginId').value = '';
      document.getElementById('loginPass').value = '';
    }

    function showApp() {
      document.getElementById('authCard').style.display = 'none';
      document.getElementById('appCard').style.display = 'block';
      document.getElementById('currentUserId').textContent = loggedInUser;
      document.getElementById('targetUserName').textContent = loggedInUser;
      toggleTargetInput();
      loadData();
    }

    function logout() {
      if (loggedInUser) {
        setOnlineStatus(loggedInUser, false);
      }
      sessionStorage.removeItem('tsuruLoggedInUser');
      loggedInUser = null;
      document.getElementById('appCard').style.display = 'none';
      document.getElementById('authCard').style.display = 'block';
    }

    function toggleTargetInput() {
      const type = document.getElementById('type').value;
      const targetGroup = document.getElementById('targetIdGroup');
      if (type.includes("送鶴")) {
        targetGroup.style.display = 'block';
      } else {
        targetGroup.style.display = 'none';
      }
    }

    function getUserBalance(name) {
      if (!name) return 0;
      const records = JSON.parse(localStorage.getItem('tsuruRecords')) || [];
      let count = 0;
      records.forEach(r => {
        if (r.name === name) {
          const amt = parseInt(r.amount, 10) || 0;
          if (r.type.includes("受鶴")) {
            count += amt;
          } else {
            count -= amt;
          }
        }
      });
      return count;
    }

    function addRecord() {
      const type = document.getElementById('type').value;
      const targetId = document.getElementById('targetId').value.trim();
      const rawAmount = document.getElementById('amount').value;
      const amount = parseInt(rawAmount, 10);
      const detail = document.getElementById('detail').value;

      if (isNaN(amount) || amount <= 0) {
        alert('数量を正しく数字で入力してください');
        return;
      }

      if (type.includes("送鶴")) {
        if (!targetId) {
          alert("送鶴相手のIDを入力してください");
          return;
        }

        if (targetId === loggedInUser) {
          alert("自分自身に送鶴することはできません");
          return;
        }

        const userPasswords = JSON.parse(localStorage.getItem('tsuruUserPasswords')) || {};
        if (!userPasswords[targetId]) {
          alert(`「${targetId}」は登録されていないIDです。登録されているユーザーのIDを指定してください。`);
          return;
        }

        const currentBalance = getUserBalance(loggedInUser);
        if (currentBalance <= 0) {
          alert("あなたは鶴を持ってないペニュ🐧");
          return;
        }
        if (currentBalance < amount) {
          alert(`所有している鶴数（${currentBalance}鶴）を超えて送信することはできません`);
          return;
        }
      }

      const date = new Date().toLocaleDateString('ja-JP');
      const detailText = targetId ? `相手:${targetId} ${detail}` : detail;
      
      let records = JSON.parse(localStorage.getItem('tsuruRecords')) || [];

      const sendRecord = { id: Date.now(), date, type, name: loggedInUser, amount, detail: detailText };
      records.unshift(sendRecord);

      if (type.includes("送鶴") && targetId) {
        const receiveRecord = {
          id: Date.now() + 1,
          date,
          type: "受鶴",
          name: targetId,
          amount,
          detail: `差出人:${loggedInUser} ${detail}`
        };
        records.unshift(receiveRecord);
      }

      localStorage.setItem('tsuruRecords', JSON.stringify(records));

      document.getElementById('amount').value = '';
      document.getElementById('detail').value = '';
      document.getElementById('targetId').value = '';

      alert('送信完了しました！');
      loadData();
    }

    function deleteRecord(id) {
      const pass = prompt('削除するには管理者パスワードを入力してください:');
      if (pass !== ADMIN_PASS) {
        alert('パスワードが正しくありません');
        return;
      }

      let records = JSON.parse(localStorage.getItem('tsuruRecords')) || [];
      records = records.filter(r => r.id !== id);
      localStorage.setItem('tsuruRecords', JSON.stringify(records));
      loadData();
    }

    function loadData() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      const records = JSON.parse(localStorage.getItem('tsuruRecords')) || [];

      const myRecords = records.filter(r => r.name === loggedInUser);

      if (myRecords.length === 0) {
        list.innerHTML = '<li style="border: 2px dashed #999999; background:#ffffff; color:#666666;">履歴はありません</li>';
      } else {
        myRecords.forEach(r => {
          const amt = parseInt(r.amount, 10) || 0;
          const li = document.createElement('li');
          li.innerHTML = `
            <div>
              <strong>${r.date} 【${r.type}】 ${amt} 鶴</strong><br>
              ${r.detail ? '(' + r.detail + ')' : ''}
            </div>
            <button class="delete-btn" onclick="deleteRecord(${r.id})">削除</button>
          `;
          list.appendChild(li);
        });
      }

      if (loggedInUser) {
        const userBal = getUserBalance(loggedInUser);
        document.getElementById('userTsuru').textContent = userBal;
      }
    }

    /* 管理者機能 */
    function openAdminIdList() {
      const pass = prompt('管理者パスワードを入力してください:');
      if (pass !== ADMIN_PASS) {
        alert('パスワードが違います');
        return;
      }

      renderAdminModalList();
      document.getElementById('idModal').style.display = 'flex';
    }

    function renderAdminModalList() {
      const userPasswords = JSON.parse(localStorage.getItem('tsuruUserPasswords')) || {};
      const activeUsers = JSON.parse(localStorage.getItem('tsuruActiveUsers')) || {};

      const container = document.getElementById('idListContainer');
      container.innerHTML = '';

      const keys = Object.keys(userPasswords);
      if (keys.length === 0) {
        container.innerHTML = '<li style="border-left:none; font-weight:normal; color:#666;">登録されたIDはありません</li>';
      } else {
        keys.forEach(idName => {
          const count = getUserBalance(idName);
          const isOnline = !!activeUsers[idName];
          const statusHtml = isOnline 
            ? '<span class="status-badge status-online">🟢 ログイン中</span>' 
            : '<span class="status-badge status-offline">⚪ オフライン</span>';

          const li = document.createElement('li');
          
          li.innerHTML = `
            <div class="id-info-row">
              <div>
                <span>${idName}</span>
                ${statusHtml}
              </div>
              <span style="color:#0284c7;">${count} 鶴</span>
            </div>
            <div class="id-action-row">
              <button class="btn-admin-action btn-grant" onclick="adminGrantTsuru('${idName}')">🎁 鶴を付与</button>
              <button class="btn-admin-action btn-delete-id" onclick="adminDeleteId('${idName}')">🗑️ ID削除</button>
            </div>
          `;
          container.appendChild(li);
        });
      }
    }

    function adminGrantTsuru(idName) {
      const input = prompt(`【${idName}】に付与する鶴の数を入力してください:`, "10");
      if (input === null) return;

      const amount = parseInt(input, 10);
      if (isNaN(amount) || amount <= 0) {
        alert('正しい正の数値を入力してください');
        return;
      }

      const date = new Date().toLocaleDateString('ja-JP');
      const record = {
        id: Date.now(),
        date,
        type: "受鶴",
        name: idName,
        amount: amount,
        detail: "管理者より特別付与"
      };

      let records = JSON.parse(localStorage.getItem('tsuruRecords')) || [];
      records.unshift(record);
      localStorage.setItem('tsuruRecords', JSON.stringify(records));

      alert(`【${idName}】に ${amount} 鶴を付与しました！`);
      loadData();
      renderAdminModalList();
    }

    function adminDeleteId(idName) {
      if (confirm(`本当にID【${idName}】を完全に削除しますか？\n（ログインできなくなります）`)) {
        let userPasswords = JSON.parse(localStorage.getItem('tsuruUserPasswords')) || {};
        delete userPasswords[idName];
        localStorage.setItem('tsuruUserPasswords', JSON.stringify(userPasswords));

        setOnlineStatus(idName, false);

        alert(`ID【${idName}】を削除しました。`);
        renderAdminModalList();
        
        if (loggedInUser === idName) {
          logout();
          closeAdminIdList();
        }
      }
    }

    function resetAllUserPasswords() {
      if (confirm('登録されているすべての「ID・パスワード」を初期化（削除）しますか？')) {
        localStorage.removeItem('tsuruUserPasswords');
        localStorage.removeItem('tsuruActiveUsers');
        alert('全アカウントを初期化しました。');
        renderAdminModalList();
        logout();
        closeAdminIdList();
      }
    }

    function closeAdminIdList() {
      document.getElementById('idModal').style.display = 'none';
    }
  </script>

</body>
</html>
