<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鶴pay</title>
  <link rel="apple-touch-icon" href="https://tsuru-master.github.io/tsuru-app/icon.png">
  <link rel="icon" href="https://tsuru-master.github.io/tsuru-app/icon.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #70d6ff 0%, #ff70a6 100%);
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }
    .container {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
      border: 3px solid #333333;
      position: relative;
    }
    h1 {
      font-size: 24px;
      color: #222222;
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 3px solid #ff477e;
      letter-spacing: 1px;
    }
    .total-card {
      background: #0284c7;
      color: #ffffff;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 20px;
      border: 2px solid #333333;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .total-title {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .total-count {
      font-size: 32px;
      font-weight: bold;
      margin-top: 4px;
    }
    .admin-nav {
      text-align: right;
      margin-bottom: 16px;
    }
    .btn-admin-view {
      background-color: #333333;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      color: #333333;
      font-weight: bold;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #555555;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      background-color: #ffffff;
      color: #111111;
      font-weight: 500;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #0077b6;
      box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.3);
    }
    
    .id-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .id-tag {
      background-color: #e0f2fe;
      color: #0369a1;
      border: 1px solid #0284c7;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .id-tag:active {
      background-color: #bae6fd;
    }

    .btn-pass-setting {
      background-color: #e2e8f0;
      color: #334155;
      border: 1px solid #94a3b8;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #ff2a70;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(255, 42, 112, 0.4);
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-submit:active {
      background-color: #d90429;
      transform: scale(0.98);
    }
    .history {
      margin-top: 24px;
      border-top: 3px solid #333333;
      padding-top: 16px;
    }
    .history h2 {
      font-size: 16px;
      color: #222222;
      margin-bottom: 12px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: #e0f2fe;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #111111;
      border: 2px solid #0284c7;
      border-left: 6px solid #ff2a70;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      background: #4b5563;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .delete-btn:active {
      background: #dc2626;
    }

    /* モーダル表示エリア */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 350px;
      border: 3px solid #333333;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-content h3 {
      margin-top: 0;
      font-size: 18px;
      color: #222222;
      border-bottom: 2px solid #0284c7;
      padding-bottom: 8px;
    }
    .id-list {
      max-height: 200px;
      overflow-y: auto;
      margin: 12px 0;
      padding: 0;
    }
    .id-list li {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-left: 4px solid #0284c7;
      margin-bottom: 6px;
      padding: 10px 12px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-reset-pass {
      width: 100%;
      padding: 10px;
      background-color: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-close {
      width: 100%;
      padding: 10px;
      background-color: #4b5563;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>鶴pay</h1>

    <div class="admin-nav">
      <button class="btn-admin-view" onclick="openAdminIdList()">🔑 管理者用 ID別鶴数一覧</button>
    </div>

    <!-- 現在持っている鶴表示 -->
    <div class="total-card">
      <div class="total-title">現在持っている鶴（全体合計）</div>
      <div class="total-count"><span id="totalTsuru">0</span> 鶴</div>
    </div>

    <div class="form-group">
      <label>区分</label>
      <select id="type" onchange="togglePasswordLabel()">
        <option value="受鶴">受鶴（増える）</option>
        <option value="送鶴">送鶴（減る）</option>
      </select>
    </div>

    <div class="form-group">
      <label>自分のID・名前（または相手のID）</label>
      <div class="id-tag-list" id="publicIdTags"></div>
      <input type="text" id="name" placeholder="例：山田太郎">
      <button type="button" class="btn-pass-setting" onclick="setUserPassword()">🔒 入力中IDの個人パスワードを設定・更新</button>
    </div>

    <div class="form-group">
      <label>数量</label>
      <input type="number" id="amount" placeholder="例：10" min="1">
    </div>

    <div class="form-group">
      <label>詳細・備考</label>
      <input type="text" id="detail" placeholder="例：お礼用">
    </div>

    <div class="form-group" id="passContainer" style="display: none;">
      <label id="passLabel">送信者の個人パスワード</label>
      <input type="password" id="userPassword" placeholder="パスワードを入力">
    </div>

    <button class="btn-submit" onclick="addRecord()">送信（記録）</button>

    <div class="history">
      <h2>記録履歴</h2>
      <ul id="historyList"></ul>
    </div>
  </div>

  <div class="modal-overlay" id="idModal">
    <div class="modal-content">
      <h3>ID毎の所有鶴数一覧</h3>
      <ul class="id-list" id="idListContainer"></ul>
      <button class="btn-reset-pass" onclick="resetAllUserPasswords()">🚨 一般用パスワードをすべて初期化</button>
      <button class="btn-close" onclick="closeAdminIdList()">閉じる</button>
    </div>
  </div>

  <script>
    const ADMIN_PASS = "1234";

    window.onload = function() {
      loadData();
      togglePasswordLabel();
    };

    function togglePasswordLabel() {
      const type = document.getElementById('type').value;
      const passContainer = document.getElementById('passContainer');
      if (type.includes("送鶴")) {
        passContainer.style.display = "block";
      } else {
        passContainer.style.display = "none";
      }
    }

    function setUserPassword() {
      const name = document.getElementById('name').value.trim();
      if (!name) {
        alert('まず名前・IDを入力してください');
        return;
      }

      let userPasswords = JSON.parse(localStorage.getItem('tsuruUserPasswords')) || {};
      const currentPass = userPasswords[name];

      let newPass = "";
      if (currentPass) {
        const verify = prompt(`【${name}】の現在のパスワードを入力してください:`);
        if (verify !== currentPass) {
          alert('パスワードが違います。変更できません。');
          return;
        }
        newPass = prompt(`【${name}】の新しいパスワードを入力してください:`);
      } else {
        newPass = prompt(`【${name}】用に登録するパスワードを決めて入力してください:`);
      }

      if (newPass && newPass.trim() !== "") {
        userPasswords[name] = newPass.trim();
        localStorage.setItem('tsuruUserPasswords', JSON.stringify(userPasswords));
        alert(`【${name}】の個人パスワードを設定しました！`);
      } else {
        alert('パスワードが入力されなかったため設定をキャンセルしました');
      }
    }

    function addRecord() {
      const type = document.getElementById('type').value;
      const name = document.getElementById('name').value.trim();
      const rawAmount = document.getElementById('amount').value;
      const amount = parseInt(rawAmount, 10);
      const detail = document.getElementById('detail').value;

      if (!name) {
        alert('名前・IDを入力してください');
        return;
      }

      if (isNaN(amount) || amount <= 0) {
        alert('数量を正しく数字で入力してください');
        return;
      }

      if (type.includes("送鶴")) {
        const userPasswords = JSON.parse(localStorage.getItem('tsuruUserPasswords')) || {};
        const registeredPass = userPasswords[name];
        const inputPass = document.getElementById('userPassword').value;

        if (!registeredPass) {
          alert(`【${name}】の個人パスワードが未設定です。「個人パスワードを設定・更新」ボタンから登録してください。`);
          return;
        }

        if (inputPass !== registeredPass) {
          alert('個人パスワードが正しくありません');
          return;
        }
      }

      const date = new Date().toLocaleDateString('ja-JP');
      const record = { id: Date.now(), date, type, name, amount, detail };

      let records = JSON.parse(localStorage.getItem('tsuruRecords')) || [];
      records.unshift(record);
      localStorage.setItem('tsuruRecords', JSON.stringify(records));

      document.getElementById('name').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('detail').value = '';
      document.getElementById('userPassword').value = '';

      alert('送信完了しました！');
      loadData();
    }

    function deleteRecord(id) {
      const pass = prompt('削除するには管理者パスワードを入力してください:');
      if (pass !== ADMIN_PASS) {
        alert('パスワードが正しくありません');
        return;
      }

      let records = JSON.parse(localStorage.getItem('tsuruRecords')) || [];
      records = records.filter(r => r.id !== id);
      localStorage.setItem('tsuruRecords', JSON.stringify(records));
      loadData();
    }

    function loadData() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      const records = JSON.parse(localStorage.getItem('tsuruRecords')) || [];

      let total = 0;
      const idSet = new Set();

      if (records.length === 0) {
        list.innerHTML = '<li style="border: 2px dashed #999999; background:#ffffff; color:#666666;">履歴はありません</li>';
      } else {
        records.forEach(r => {
          const amt = parseInt(r.amount, 10) || 0;

          if (r.name) idSet.add(r.name);

          if (r.type.includes("受鶴")) {
            total += amt;
          } else {
            total -= amt;
          }

          const li = document.createElement('li');
          li.innerHTML = `
            <div>
              <strong>${r.date} 【${r.type}】 ${amt} 鶴</strong><br>
              ${r.name} ${r.detail ? '(' + r.detail + ')' : ''}
            </div>
            <button class="delete-btn" onclick="deleteRecord(${r.id})">削除</button>
          `;
          list.appendChild(li);
        });
      }

      document.getElementById('totalTsuru').textContent = isNaN(total) ? 0 : total;
      renderPublicIdTags(Array.from(idSet));
    }

    function renderPublicIdTags(idArray) {
      const tagContainer = document.getElementById('publicIdTags');
      tagContainer.innerHTML = '';

      if (idArray.length > 0) {
        idArray.forEach(idName => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'id-tag';
          btn.textContent = idName;
          btn.onclick = function() {
            document.getElementById('name').value = idName;
          };
          tagContainer.appendChild(btn);
        });
      }
    }

    function openAdminIdList() {
      const pass = prompt('管理者パスワードを入力してください:');
      if (pass !== ADMIN_PASS) {
        alert('パスワードが違います');
        return;
      }

      const records = JSON.parse(localStorage.getItem('tsuruRecords')) || [];
      const idTotals = {};

      records.forEach(r => {
        if (!r.name) return;
        const amt = parseInt(r.amount, 10) || 0;

        if (!idTotals[r.name]) {
          idTotals[r.name] = 0;
        }

        if (r.type.includes("受鶴")) {
          idTotals[r.name] += amt;
        } else {
          idTotals[r.name] -= amt;
        }
      });

      const container = document.getElementById('idListContainer');
      container.innerHTML = '';

      const keys = Object.keys(idTotals);
      if (keys.length === 0) {
        container.innerHTML = '<li style="border-left:none; font-weight:normal; color:#666;">登録されたIDはありません</li>';
      } else {
        keys.forEach(idName => {
          const count = idTotals[idName];
          const li = document.createElement('li');
          li.innerHTML = `<span>${idName}</span> <span style="color:#0284c7;">${count} 鶴</span>`;
          container.appendChild(li);
        });
      }

      document.getElementById('idModal').style.display = 'flex';
    }

    function resetAllUserPasswords() {
      if (confirm('登録されているすべての「個人パスワード」を初期化（削除）しますか？\n（ユーザーは再度パスワードの設定が必要になります）')) {
        localStorage.removeItem('tsuruUserPasswords');
        alert('個人パスワードをすべて初期化しました。');
      }
    }

    function closeAdminIdList() {
      document.getElementById('idModal').style.display = 'none';
    }
  </script>

</body>
</html>
