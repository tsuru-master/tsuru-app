<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>送鶴・受鶴 管理システム</title>
  <link rel="apple-touch-icon" href="https://tsuru-master.github.io/tsuru-app/icon.png">
  <link rel="icon" href="https://tsuru-master.github.io/tsuru-app/icon.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #70d6ff 0%, #ff70a6 100%);
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }
    .container {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
      border: 3px solid #333333;
    }
    h1 {
      font-size: 20px;
      color: #222222;
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 3px solid #ff477e;
    }
    /* 所持数表示エリア */
    .total-card {
      background: #0284c7;
      color: #ffffff;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 20px;
      border: 2px solid #333333;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .total-title {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .total-count {
      font-size: 32px;
      font-weight: bold;
      margin-top: 4px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 14px;
      color: #333333;
      font-weight: bold;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #555555;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      background-color: #ffffff;
      color: #111111;
      font-weight: 500;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #0077b6;
      box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.3);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: #ff2a70;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(255, 42, 112, 0.4);
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-submit:active {
      background-color: #d90429;
      transform: scale(0.98);
    }
    .history {
      margin-top: 24px;
      border-top: 3px solid #333333;
      padding-top: 16px;
    }
    .history h2 {
      font-size: 16px;
      color: #222222;
      margin-bottom: 12px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      background: #e0f2fe;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 14px;
      color: #111111;
      border: 2px solid #0284c7;
      border-left: 6px solid #ff2a70;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      background: #4b5563;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .delete-btn:active {
      background: #dc2626;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>送鶴・受鶴 管理システム</h1>

    <!-- 現在所持している鶴の表示エリア -->
    <div class="total-card">
      <div class="total-title">現在持っている鶴</div>
      <div class="total-count"><span id="totalTsuru">0</span> 羽</div>
    </div>

    <div class="form-group">
      <label>区分</label>
      <select id="type">
        <option value="受鶴">受鶴（増える）</option>
        <option value="送鶴">送鶴（減る）</option>
      </select>
    </div>

    <div class="form-group">
      <label>相手の名前</label>
      <input type="text" id="name" placeholder="例：山田太郎">
    </div>

    <div class="form-group">
      <label>数量（羽数）</label>
      <input type="number" id="amount" placeholder="例：10" min="1">
    </div>

    <div class="form-group">
      <label>詳細・備考</label>
      <input type="text" id="detail" placeholder="例：お礼用">
    </div>

    <div class="form-group">
      <label>管理者パスワード</label>
      <input type="password" id="adminPassword" placeholder="パスワードを入力">
    </div>

    <button class="btn-submit" onclick="addRecord()">送信（記録）</button>

    <div class="history">
      <h2>記録履歴</h2>
      <ul id="historyList"></ul>
    </div>
  </div>

  <script>
    const ADMIN_PASS = "1234";

    window.onload = function() {
      loadData();
    };

    function addRecord() {
      const type = document.getElementById('type').value;
      const name = document.getElementById('name').value;
      const amount = parseInt(document.getElementById('amount').value, 10);
      const detail = document.getElementById('detail').value;
      const inputPass = document.getElementById('adminPassword').value;

      if (!name) {
        alert('名前を入力してください');
        return;
      }

      if (isNaN(amount) || amount <= 0) {
        alert('数量を正しく入力してください');
        return;
      }

      if (inputPass !== ADMIN_PASS) {
        alert('管理者パスワードが違います');
        return;
      }

      const date = new Date().toLocaleDateString('ja-JP');
      const record = { id: Date.now(), date, type, name, amount, detail };

      let records = JSON.parse(localStorage.getItem('tsuruRecords')) || [];
      records.unshift(record);
      localStorage.setItem('tsuruRecords', JSON.stringify(records));

      // フォームリセット
      document.getElementById('name').value = '';
      document.getElementById('amount').value = '';
      document.getElementById('detail').value = '';
      document.getElementById('adminPassword').value = '';

      alert('送信完了しました！');
      loadData();
    }

    function deleteRecord(id) {
      const pass = prompt('削除するには管理者パスワードを入力してください:');
      if (pass !== ADMIN_PASS) {
        alert('パスワードが正しくありません');
        return;
      }

      let records = JSON.parse(localStorage.getItem('tsuruRecords')) || [];
      records = records.filter(r => r.id !== id);
      localStorage.setItem('tsuruRecords', JSON.stringify(records));
      loadData();
    }

    function loadData() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      const records = JSON.parse(localStorage.getItem('tsuruRecords')) || [];

      let total = 0;

      if (records.length === 0) {
        list.innerHTML = '<li style="border: 2px dashed #999999; background:#ffffff; color:#666666;">履歴はありません</li>';
      } else {
        records.forEach(r => {
          // 合計羽数の計算（受鶴ならプラス、送鶴ならマイナス）
          if (r.type.includes("受鶴")) {
            total += r.amount;
          } else {
            total -= r.amount;
          }

          const li = document.createElement('li');
          li.innerHTML = `
            <div>
              <strong>${r.date} 【${r.type}】 ${r.amount}羽</strong><br>
              ${r.name} ${r.detail ? '(' + r.detail + ')' : ''}
            </div>
            <button class="delete-btn" onclick="deleteRecord(${r.id})">削除</button>
          `;
          list.appendChild(li);
        });
      }

      // 合計を画面へセット
      document.getElementById('totalTsuru').textContent = total;
    }
  </script>

</body>
</html>
