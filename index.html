<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>送鶴・受鶴 管理システム</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 16px;
      background-color: #f7f9fa;
      color: #333;
    }
    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 16px;
    }
    .user-setup {
      background: #eef6ff;
      border: 1px solid #bce0fd;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-setup span {
      font-weight: bold;
      color: #0056b3;
    }
    .user-actions {
      display: flex;
      gap: 6px;
    }
    .user-setup button {
      width: auto;
      padding: 6px 10px;
      margin: 0;
      font-size: 0.75rem;
      background-color: #6c757d;
      color: white;
      border: none;
      border-radius: 6px;
    }
    .balance-card {
      background: linear-gradient(135deg, #007aff, #0056b3);
      color: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
      position: relative;
    }
    .balance-title {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-bottom: 4px;
    }
    .balance-value {
      font-size: 2.2rem;
      font-weight: bold;
    }
    .admin-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: white;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      width: auto;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 12px;
      border-bottom: 2px solid #eee;
      padding-bottom: 6px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 8px;
      margin-bottom: 4px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      margin-top: 14px;
      background-color: #ff3b30;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      opacity: 0.8;
    }
    .history-item {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: white;
      font-weight: bold;
    }
    .badge-send { background-color: #ff3b30; }
    .badge-receive { background-color: #34c759; }
    .badge-admin { background-color: #ff9500; }
    .meta {
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>送鶴・受鶴 管理システム</h1>

  <!-- ユーザー設定エリア -->
  <div class="user-setup">
    <div>ID: <span id="myUsernameDisplay">未設定</span></div>
    <div class="user-actions">
      <button id="changeUserBtn">ID切替</button>
      <button id="changePwBtn">PW変更</button>
    </div>
  </div>

  <!-- 現在の所持鶴数 -->
  <div class="balance-card">
    <button class="admin-btn" id="adminAddBtn">⚙️ 管理者追加</button>
    <div class="balance-title">現在の所持鶴数</div>
    <div class="balance-value"><span id="totalBalance">0</span> <span style="font-size: 1.2rem;">鶴</span></div>
  </div>

  <!-- 送鶴フォーム -->
  <div class="card">
    <h2>鶴を送る（送鶴）</h2>
    
    <label for="receiver">送信相手のID（ユーザー名）</label>
    <input type="text" id="receiver" placeholder="例: 太郎">

    <label for="count">送る鶴数</label>
    <input type="number" id="count" placeholder="例: 10" min="1">

    <label for="note">備考 / メモ</label>
    <input type="text" id="note" placeholder="例: お礼として">

    <button id="submitBtn">鶴を送信する</button>
  </div>

  <!-- 履歴表示 -->
  <div class="card">
    <h2>履 歴</h2>
    <div id="historyList">IDを設定してください...</div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc, setDoc, updateDoc, query, orderBy, onSnapshot, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const ADMIN_PASSWORD = "8888";  // 管理者専用パスワード（鶴数増加用）

    const firebaseConfig = {
      apiKey: "AIzaSyAJR5Omm-_0KpqCoGXs7ZlK1IvomdmQmko",
      authDomain: "tsurusaki-point.firebaseapp.com",
      projectId: "tsurusaki-point",
      storageBucket: "tsurusaki-point.firebasestorage.app",
      messagingSenderId: "945501362718",
      appId: "1:945501362718:web:e76b743b87e5b21112ec0f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const recordsRef = collection(db, "tsuru_records");
    const usersRef = collection(db, "tsuru_users");

    let currentUsername = localStorage.getItem("tsuru_username") || "";
    let unsubscribe = null;

    // IDの設定と初期PW確認
    async function initUser() {
      if (!currentUsername) {
        const input = prompt("あなたのID（ユーザー名）を入力してください:");
        if (input && input.trim()) {
          currentUsername = input.trim();
          localStorage.setItem("tsuru_username", currentUsername);
        }
      }

      if (currentUsername) {
        await checkAndRegisterUser(currentUsername);
        document.getElementById("myUsernameDisplay").textContent = currentUsername;
        listenToRecords();
      } else {
        document.getElementById("myUsernameDisplay").textContent = "未設定";
      }
    }

    // IDが存在しなければパスワードを作成、存在すればパスワードの有無を確認
    async function checkAndRegisterUser(username) {
      const userDocRef = doc(db, "tsuru_users", username);
      const userDoc = await getDoc(userDocRef);

      if (!userDoc.exists()) {
        const pw = prompt(`ID「${username}」の初期パスワードを設定してください:`);
        if (pw && pw.trim()) {
          await setDoc(userDocRef, { password: pw.trim() });
          alert(`ID「${username}」のパスワードを設定しました。`);
        } else {
          alert("パスワードが設定されませんでした。次回送信時に確認されます。");
        }
      }
    }

    // ID切り替え
    document.getElementById("changeUserBtn").addEventListener("click", async () => {
      const input = prompt("新しいID（ユーザー名）を入力してください:", currentUsername);
      if (input && input.trim()) {
        currentUsername = input.trim();
        localStorage.setItem("tsuru_username", currentUsername);
        await checkAndRegisterUser(currentUsername);
        document.getElementById("myUsernameDisplay").textContent = currentUsername;
        listenToRecords();
      }
    });

    // パスワード変更処理
    document.getElementById("changePwBtn").addEventListener("click", async () => {
      if (!currentUsername) {
        alert("先にIDを設定してください。");
        return;
      }

      const userDocRef = doc(db, "tsuru_users", currentUsername);
      const userDoc = await getDoc(userDocRef);

      if (userDoc.exists()) {
        const currentPw = prompt("現在のパスワードを入力してください:");
        if (currentPw !== userDoc.data().password) {
          alert("現在のパスワードが違います。");
          return;
        }
      }

      const newPw = prompt("新しいパスワードを入力してください:");
      if (newPw && newPw.trim()) {
        await setDoc(userDocRef, { password: newPw.trim() }, { merge: true });
        alert("パスワードを変更しました！");
      } else {
        alert("有効なパスワードを入力してください。");
      }
    });

    // 管理者追加機能
    document.getElementById("adminAddBtn").addEventListener("click", async () => {
      if (!currentUsername) {
        alert("先にIDを設定してください。");
        return;
      }

      const pw = prompt("管理者パスワードを入力してください:");
      if (pw === null) return;
      if (pw !== ADMIN_PASSWORD) {
        alert("管理者パスワードが違います。");
        return;
      }

      const countStr = prompt("追加したい鶴数を入力してください:");
      if (!countStr) return;
      const count = parseInt(countStr, 10);

      if (!count || count <= 0) {
        alert("正しい鶴数を入力してください。");
        return;
      }

      try {
        await addDoc(recordsRef, {
          sender: "SYSTEM_ADMIN",
          receiver: currentUsername,
          count: count,
          note: "管理者による特別付与",
          createdAt: serverTimestamp()
        });
        alert(`${count} 鶴を追加しました！`);
      } catch (e) {
        console.error("追加エラー:", e);
        alert("追加に失敗しました。");
      }
    });

    // 送鶴ボタンの処理（パスワード判定）
    document.getElementById("submitBtn").addEventListener("click", async () => {
      if (!currentUsername) {
        alert("先にIDを設定してください。");
        return;
      }

      const receiver = document.getElementById("receiver").value.trim();
      const count = parseInt(document.getElementById("count").value, 10);
      const note = document.getElementById("note").value.trim();

      if (!receiver) {
        alert("送信相手のIDを入力してください。");
        return;
      }
      if (receiver === currentUsername) {
        alert("自分自身に送ることはできません。管理者追加ボタン（⚙️）を使用してください。");
        return;
      }
      if (!count || count <= 0) {
        alert("正しい鶴数を入力してください。");
        return;
      }

      // IDのパスワード認証
      const userDocRef = doc(db, "tsuru_users", currentUsername);
      const userDoc = await getDoc(userDocRef);

      if (userDoc.exists()) {
        const inputPw = prompt(`ID「${currentUsername}」のパスワードを入力してください:`);
        if (inputPw === null) return;
        if (inputPw !== userDoc.data().password) {
          alert("パスワードが正しくありません。");
          return;
        }
      } else {
        const newPw = prompt(`ID「${currentUsername}」のパスワードを設定してください:`);
        if (!newPw || !newPw.trim()) {
          alert("パスワードが設定されなかったため、送信を中止しました。");
          return;
        }
        await setDoc(userDocRef, { password: newPw.trim() });
      }

      try {
        await addDoc(recordsRef, {
          sender: currentUsername,
          receiver: receiver,
          count: count,
          note: note,
          createdAt: serverTimestamp()
        });

        document.getElementById("receiver").value = "";
        document.getElementById("count").value = "";
        document.getElementById("note").value = "";
        alert(`${receiver} 様へ ${count} 鶴を送信しました。`);
      } catch (e) {
        console.error("送信エラー:", e);
        alert("送信に失敗しました。");
      }
    });

    // 履歴・所持鶴数のリアルタイム同期
    function listenToRecords() {
      if (unsubscribe) unsubscribe();

      const q = query(recordsRef, orderBy("createdAt", "desc"));
      unsubscribe = onSnapshot(q, (snapshot) => {
        const historyList = document.getElementById("historyList");
        historyList.innerHTML = "";

        let total = 0;
        let countHistory = 0;

        snapshot.forEach((doc) => {
          const data = doc.data();
          const isSender = data.sender === currentUsername;
          const isReceiver = data.receiver === currentUsername;

          if (!isSender && !isReceiver) return;

          countHistory++;
          const dateStr = data.createdAt ? data.createdAt.toDate().toLocaleString("ja-JP") : "処理中...";

          if (isReceiver) {
            total += data.count;
          }
          if (isSender) {
            total -= data.count;
          }

          const isAdminAdd = data.sender === "SYSTEM_ADMIN";

          const item = document.createElement("div");
          item.className = "history-item";
          item.innerHTML = `
            <div>
              <span class="badge ${isAdminAdd ? 'badge-admin' : (isSender ? 'badge-send' : 'badge-receive')}">
                ${isAdminAdd ? '特別付与' : (isSender ? '送鶴' : '受鶴')}
              </span>
              <strong>${data.count} 鶴</strong>
              <div class="meta">
                ${isAdminAdd ? '管理者より追加' : (isSender ? `宛先: ${data.receiver}` : `差出人: ${data.sender}`)}
                ${data.note ? ` (${data.note})` : ''}
              </div>
            </div>
            <div class="meta">${dateStr}</div>
          `;
          historyList.appendChild(item);
        });

        if (countHistory === 0) {
          historyList.innerHTML = "<p>まだ送受信の履歴はありません。</p>";
        }

        document.getElementById("totalBalance").textContent = total;
      });
    }

    initUser();
  </script>
</body>
</html>
